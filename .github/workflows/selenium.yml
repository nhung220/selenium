name: Selenium practice

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Selenium tests on Chrome
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python scripts/inspect_hsk.py 2>&1 | tee reports/run.log
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: reports/
          if-no-files-found: warn
